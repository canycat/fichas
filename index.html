<div id="bgLogo" aria-hidden="true"></div>

<!-- ===== Barra superior ===== -->
<header class="sticky top-0 z-30 bg-brand-700 text-white paws-white" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-2xl mx-auto flex items-center gap-0.5 px-2 h-14">
    <button id="btnBack" class="hidden p-2 rounded-full active:bg-brand-800" onclick="goBack()" aria-label="Volver">
      <i data-lucide="arrow-left" class="w-6 h-6"></i>
    </button>
    <div class="flex items-center gap-2 flex-1 min-w-0 pl-1">
      <div role="img" aria-label="CanyCat" class="img-logo w-9 h-9 rounded-full bg-white ring-2 ring-white/70 shrink-0"></div>
      <div class="min-w-0">
        <h1 class="font-extrabold uppercase tracking-wide leading-tight truncate text-[15px]">CanyCat</h1>
        <button id="syncStatus" onclick="ajustes()" class="flex items-center gap-1 text-[11px] text-brand-100 leading-tight max-w-full truncate"></button>
      </div>
    </div>
    <button onclick="exportar()" class="hbtn" aria-label="Exportar respaldo JSON"><i data-lucide="download" class="w-5 h-5"></i><span>Exportar</span></button>

    <button onclick="ajustes()" class="hbtn" aria-label="Ajustes"><i data-lucide="settings" class="w-5 h-5"></i><span>Ajustes</span></button>
    <input type="file" id="fileImport" accept=".json,application/json" class="hidden" onchange="importar(this)">

</header>

<main class="max-w-2xl mx-auto pb-32">
  <!-- ===== Vista: listado ===== -->
  <section id="view-list">
    <div class="relative overflow-hidden bg-brand-700 text-white px-4 pt-1 pb-5 rounded-b-[28px] shadow-md paws-white">
      <span id="heroProf" class="inline-block bg-white text-brand-800 font-extrabold uppercase tracking-wide text-[11px] px-2.5 py-1 shadow-sm"></span>
      <p class="mt-2 text-lg font-extrabold uppercase leading-tight">Servicios veterinarios<br>a domicilio</p>
      <svg class="mt-1.5 w-36 h-2.5" viewBox="0 0 144 10" fill="none" aria-hidden="true"><path d="M2 5 Q 8 0 14 5 T 26 5 T 38 5 T 50 5 T 62 5 T 74 5 T 86 5 T 98 5 T 110 5 T 122 5 T 134 5 T 142 5" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>

    </div>
    <div class="sticky z-20 px-3 pt-3 pb-2 bg-brand-50/80 backdrop-blur" style="top:calc(3.5rem + env(safe-area-inset-top))">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="search" type="search" autocomplete="off" placeholder="Buscar mascota, dueño o RUT…"
               class="fld !pl-10 !pr-10 !py-3 !rounded-2xl shadow-sm" oninput="state.q=this.value; renderList()">

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const icons = () => window.lucide && lucide.createIcons();
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function fmtDate(s) { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}-${m}-${y}`; }
function fmtSlash(s, corto) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${corto ? y.slice(2) : y}`; }
function daysUntil(s) {
  if (!s) return null;
  const t = new Date(s + 'T00:00:00'), n = new Date(today() + 'T00:00:00');
  return Math.round((t - n) / 86400000);
}
/* Edad en meses entre dos fechas ISO */
function mesesEntre(nac, ref) {
  if (!nac) return null;
  const b = new Date(nac + 'T00:00:00'), n = ref ? new Date(ref + 'T00:00:00') : new Date();
  let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) m--;
  return m < 0 ? null : m;
}
function edad(nac, ref, conector = '') {
  const m = mesesEntre(nac, ref);
  if (m === null) return '';
  const a = Math.floor(m / 12), r = m % 12;
  const ta = plural(a, 'año', 'años'), tm = plural(r, 'mes', 'meses');
  if (a === 0) return tm;
  if (r === 0) return ta;
  return `${ta}${conector ? ' ' + conector : ''} ${tm}`;
}
function addMonths(s, months) { const d = new Date(s + 'T00:00:00'); d.setMonth(d.getMonth() + months); return isoLocal(d); }

/* RUT chileno */
function rutClean(r) { return String(r || '').replace(/[^0-9kK]/g, '').toUpperCase(); }
function rutFormat(r) {
  const c = rutClean(r);
  if (c.length < 2) return String(r || '').trim();
  return c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1);
}
function rutValid(r) {
  const c = rutClean(r);
  if (!/^\d{7,8}[0-9K]$/.test(c)) return false;
  let s = 0, m = 2;
  for (let i = c.length - 2; i >= 0; i--) { s += +c[i] * m; m = m === 7 ? 2 : m + 1; }
  const v = 11 - (s % 11);
  return (v === 11 ? '0' : v === 10 ? 'K' : String(v)) === c.slice(-1);
}
/* Teléfono → formato WhatsApp (Chile) */
function waNum(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.length === 9 && d[0] === '9') d = '56' + d;
  else if (d.length === 8) d = '569' + d;
  return d;
}

function normalizeP(p) {
  const b = blankPatient();
  return {

/* =================================================================
   CAPA DE ALMACENAMIENTO
   Toda la app guarda/borra SOLO a través de Store.
   - LocalStore: localStorage del dispositivo.
   - CloudStore: Firebase Firestore (con caché sin conexión).
   ================================================================= */
const LocalStore = {
  nombre: 'Solo este dispositivo',
  loadAll() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d.map(normalizeP) : []; }
    catch (e) { return []; }
  },
  _write() { localStorage.setItem(KEY, JSON.stringify(db)); },
  async upsert() { this._write(); },
  async remove() { this._write(); },
  async replaceAll() { this._write(); }
};

let fb = null;              // { auth, fs }
let cloudIds = new Set();   // ids presentes en la nube (último snapshot)
let unsubSnap = null;
const plain = o => JSON.parse(JSON.stringify(o));
const col = () => fb.fs.collection(COLECCION);
/* Con caché sin conexión, Firestore confirma al servidor cuando vuelve la señal:
   por eso no se espera la promesa (la UI sigue fluida) y solo se avisan errores. */
function send(promise) {
  promise.catch(e => {
    console.error(e);
    toast(e && e.code === 'permission-denied'
      ? 'Sin permiso para guardar en la nube (revisa la cuenta).'
      : 'Error al guardar en la nube. Exporta un respaldo por seguridad.', 'error');
  });
}
const CloudStore = {
  nombre: 'Nube (Firebase)',
  loadAll() { return db; },
  upsert(p) { send(col().doc(p.id).set(plain(p))); },
  remove(id) { send(col().doc(id).delete()); },
  replaceAll(list) {
    const ids = new Set(list.map(p => p.id)), ops = [];
    cloudIds.forEach(id => { if (!ids.has(id)) ops.push(b => b.delete(col().doc(id))); });
    list.forEach(p => ops.push(b => b.set(col().doc(p.id), plain(p))));
    for (let i = 0; i < ops.length; i += 450) {
      const batch = fb.fs.batch();
      ops.slice(i, i + 450).forEach(f => f(batch));
      send(batch.commit());
    }
  }
};
let Store = LocalStore;

/* Envoltorio único con manejo de errores */
async function persist(op, arg) {
  try { await Store[op](arg); return true; }
  catch (e) {
    console.error(e);
    toast(e && e.name === 'QuotaExceededError'
      ? 'No se pudo guardar: almacenamiento lleno. Exporta un respaldo.'
      : 'No se pudo guardar. Inténtalo de nuevo.', 'error');
    return false;
  }
}

/* ---------- Estado sanitario ---------- */
function badge(text, color) {
  const map = {
    red: 'bg-rose-100 text-rose-700', amber: 'bg-amber-100 text-amber-800',
    green: 'bg-emerald-100 text-emerald-700', slate: 'bg-slate-100 text-slate-600',
    violet: 'bg-violet-100 text-violet-700', orange: 'bg-orange-100 text-orange-700', brand: 'bg-brand-100 text-brand-800'
  };
  return `<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold whitespace-nowrap ${map[color]}">${text}</span>`;
}
function vigBadge(s, labels = {}) {
  const d = daysUntil(s);
  if (d === null) return badge('Sin vigencia', 'slate');
  if (d < 0) return badge(`${labels.vencida || 'Vencida hace'} ${-d} d`, 'red');
  if (d === 0) return badge(labels.hoy || 'Vence hoy', 'amber');
  if (d <= 30) return badge(`${labels.pronto || 'Vence en'} ${d} d`, 'amber');
  return badge(labels.ok || 'Vigente', 'green');
}
function estadoSanitario(p) {
  const g = {};
  p.vacunas.forEach(v => { const k = 'v-' + (v.tipo || v.nombre); if (!g[k] || (v.fecha || '') > (g[k].fecha || '')) g[k] = v; });
  p.desparasitaciones.forEach(d => { const k = 'd-' + d.tipo; if (!g[k] || (d.fecha || '') > (g[k].fecha || '')) g[k] = d; });
  let worst = null;
  Object.values(g).forEach(x => {
    const d = daysUntil(x.vigencia || x.proxima);
    if (d === null) return;
    if (d < 0) worst = 'vencida';
    else if (d <= 30) { if (worst !== 'vencida') worst = 'pronto'; }
    else if (!worst) worst = 'ok';
  });
  return worst;
}
function ultimo(arr, filtro) {
  return arr.filter(filtro).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))[0];
}
/* "Ninguna", "No", "Sin alergias", "Niega"… no generan alerta */
const tieneAlergias = t => !!t && !/^\s*(?:(?:no|ninguna?|sin|niega|nada|desconoce|n\/a)\b|-+\s*$)/i.test(t);
const speciesIcon = e => e === 'Felino' ? 'cat' : e === 'Canino' ? 'dog' : 'paw-print';
const speciesColor = e => e === 'Felino' ? 'bg-violet-100 text-violet-700' : e === 'Canino' ? 'bg-amber-100 text-amber-700' : 'bg-brand-100 text-brand-700';

/* ---------- Estado de sincronización (encabezado) ---------- */
/* [icono, texto corto (encabezado), texto completo (ajustes)] */
const SYNC = {
  local:      ['smartphone',  'Solo este equipo', 'Solo en este dispositivo'],
  connecting: ['cloud',       'Conectando…',      'Conectando con la nube…'],
  ok:         ['cloud-check', 'Sincronizado',     'Sincronizado en la nube'],
  pending:    ['refresh-cw',  'Guardando…',       'Guardando en la nube…'],
  offline:    ['cloud-off',   'Sin señal',        'Sin señal: los cambios se suben al reconectar']
};
function renderSync() {
  const [ic, txt] = SYNC[state.sync] || SYNC.local;
  $('#syncStatus').title = (SYNC[state.sync] || SYNC.local)[2];
  $('#syncStatus').innerHTML = `<i data-lucide="${ic}" class="w-3.5 h-3.5 shrink-0 ${state.sync === 'pending' ? 'spin' : ''}"></i><span class="truncate">${txt}</span>`;
  icons();
}
function updateSync(meta) {
  if (Store !== CloudStore) { state.sync = 'local'; }
  else if (!navigator.onLine) state.sync = 'offline';
  else if (meta && meta.hasPendingWrites) state.sync = 'pending';
  else if (meta && meta.fromCache) state.sync = 'connecting';
  else state.sync = 'ok';
  renderSync();
}
window.addEventListener('online', () => updateSync());
window.addEventListener('offline', () => updateSync());

            <i data-lucide="${ic}" class="w-4 h-4"></i>${l}${n ? `<span class="rounded-full px-1.5 text-[11px] ${act ? 'bg-sun-400 text-brand-900' : 'bg-slate-100'}">${n}</span>` : ''}</button>`;
        }).join('')}
      </div>
    </nav>
    <div class="p-3 space-y-3">${tabContent(p)}</div>`;
  icons();
  const activeTab = $('#view-patient nav button.bg-brand-700');
  if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function setTab(t) {
  if (state.tab === 'anamnesis' && anamTimer) anamSave(false);
  state.tab = t;
  renderPatient();
  const nav = $('#view-patient nav');
  if (nav && window.scrollY > nav.offsetTop) window.scrollTo({ top: nav.offsetTop - 56 });
}
function tabContent(p) {
  if (state.tab === 'anamnesis') return tabAnamnesis(p);
  if (state.tab === 'sanitario') return tabSanitario(p);
  if (state.tab === 'consultas') return tabConsultas(p);
  return tabDatos(p);
}

/* =================================================================
   INFORME PARA EL TUTOR (texto para WhatsApp / correo)
   Formato basado en copy_informe_tipo.txt
   ================================================================= */
const conPunto = s => { s = String(s || '').trim(); return s && !/[.!?…:]$/.test(s) ? s + '.' : s; };
function generarInforme(p, c) {
  const m = p.mascota, aj = getAjustes();
  const hembra = m.sexo === 'Hembra';
  const estado = m.estadoRep === 'Castrado / Esterilizado' ? (hembra ? 'esterilizada' : 'castrado')
    : m.estadoRep === 'Entero' ? (hembra ? 'entera' : 'entero') : '';
  const peso = c.peso || m.peso;
  const L = [];
  L.push(`Nombre Mascota: ${(m.nombre || '').toUpperCase()}`);
  if (m.raza || estado) L.push(`Raza: ${[m.raza, estado].filter(Boolean).join(' ')}`);
  if (m.color) L.push(`Color: ${m.color}`);
  if (peso) L.push(`Peso: ${String(peso).replace('.', ',')} kilos`);
  if (m.fechaNac) L.push(`Fecha Nacimiento: ${fmtSlash(m.fechaNac)}`);
  L.push(`Microchip: ${m.microchip ? 'Sí' : 'No'}`);
  L.push('');
  L.push(`Fecha Visita: ${fmtSlash(c.fecha, true)}`);
  const ed = edad(m.fechaNac, c.fecha, 'y');
  if (ed) L.push(`Edad: ${ed}.`);
  if (c.motivo) L.push(`Motivo consulta: ${conPunto(c.motivo)}`);
  [c.diagnostico, c.tratamiento].filter(Boolean).forEach(t => L.push(conPunto(t)));
  if (c.indicaciones) { L.push('', 'Indicaciones:', c.indicaciones.trim()); }
  if (c.otros) { L.push('', 'Otros:', c.otros.trim()); }
  if (c.control) { L.push('', `Próximo control: ${fmtSlash(c.control)}`); }
  const firma = [aj.profesional, aj.titulo, aj.firmaExtra].filter(Boolean);
  if (firma.length) L.push('', ...firma);
  return L.join('\n');
}
function informeForm(cid) {
  const p = cur(); const c = p && p.consultas.find(x => x.id === cid);
  if (!c) return;
  const o = p.propietario;
  openSheet('Informe para el tutor', `
    <p class="text-xs text-slate-500 mb-2">Revisa y edita el texto si lo necesitas antes de enviarlo.</p>
    <textarea id="informeTxt" class="fld font-mono !text-[14px] leading-relaxed" rows="16">${esc(generarInforme(p, c))}</textarea>
    <div class="grid grid-cols-1 gap-2 mt-3 pb-2">
      <button class="btn-primary" onclick="copiarInforme()"><i data-lucide="copy" class="w-5 h-5"></i>Copiar texto</button>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn bg-emerald-600 text-white active:bg-emerald-700" onclick="enviarInforme('wa')"><i data-lucide="message-circle" class="w-5 h-5"></i>WhatsApp</button>
        <button class="btn-ghost" onclick="enviarInforme('mail')"><i data-lucide="mail" class="w-5 h-5"></i>Correo</button>
      </div>
      <p class="text-[11px] text-slate-400 text-center">${o.telefono ? 'WhatsApp se abre con el número del tutor.' : 'Sin teléfono registrado: WhatsApp te pedirá elegir el contacto.'} ${o.email ? '' : 'Sin correo registrado.'}</p>
    </div>`);
  state.informeCid = cid;
}
async function copiarInforme() {
  const t = $('#informeTxt'); if (!t) return;
  try { await navigator.clipboard.writeText(t.value); }
  catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); } catch (_) {} }
  toast('Informe copiado: pégalo en WhatsApp o en un correo');
}
function enviarInforme(via) {
  const t = $('#informeTxt'), p = cur(); if (!t || !p) return;
  const c = p.consultas.find(x => x.id === state.informeCid) || {};
  const txt = t.value, o = p.propietario;
  if (via === 'wa') {
    const n = waNum(o.telefono);
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');
  } else {
    const asunto = `Informe de atención – ${p.mascota.nombre || 'Mascota'} – ${fmtSlash(c.fecha)}`;
    location.href = `mailto:${encodeURIComponent(o.email || '')}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(txt)}`;
  }
}

      ${secTitle('Datos de la mascota', 'paw-print')}

      ${sel('Sexo', 'm_sexo', m.sexo, ['', 'Macho', 'Hembra'])}
      ${inp('Raza', 'm_raza', m.raza, { ph: 'Ej: Mestizo' })}
      ${sel('Estado reproductivo', 'm_estadoRep', m.estadoRep, ['', 'Entero', 'Castrado / Esterilizado'])}
      ${inp('Color / pelaje', 'm_color', m.color)}
      ${inp('Peso (kg)', 'm_peso', m.peso, { type: 'number', attrs: 'step="0.01" min="0" inputmode="decimal"' })}
      ${inp('Fecha de nacimiento', 'm_fechaNac', m.fechaNac, { type: 'date', attrs: `max="${today()}" oninput="document.getElementById('edadHint').textContent=edad(this.value)?'Edad: '+edad(this.value):''"` })}
      <div class="flex items-end pb-3 text-sm text-brand-700 font-semibold" id="edadHint">${m.fechaNac && edad(m.fechaNac) ? 'Edad: ' + edad(m.fechaNac) : ''}</div>
      ${inp('N° Microchip', 'm_microchip', m.microchip, { full: true, ph: '15 dígitos (ISO 11784/11785)', attrs: 'inputmode="numeric" maxlength="20"' })}

      ${secTitle('Datos del propietario / tutor', 'user')}
      ${inp('Nombre completo', 'o_nombre', o.nombre, { req: true, full: true })}
      <label class="block col-span-2"><span class="lbl">RUT / Documento</span>
        <input class="fld" name="o_rut" value="${esc(o.rut)}" placeholder="12.345.678-9" autocapitalize="characters"
          oninput="rutHint(this)" onblur="if(/^[0-9kK.\\-\\s]+$/.test(this.value)&&rutClean(this.value).length>=8){this.value=rutFormat(this.value)} rutHint(this)">
        <span id="rutHint" class="block text-xs mt-1"></span></label>
      ${inp('Teléfono', 'o_telefono', o.telefono, { type: 'tel', full: true, ph: '+56 9 1234 5678', attrs: 'inputmode="tel"' })}
      ${inp('Correo electrónico', 'o_email', o.email, { type: 'email', full: true, attrs: 'inputmode="email" autocapitalize="off"' })}
      ${inp('Dirección', 'o_direccion', o.direccion, { full: true, ph: 'Calle, número, depto.' })}
      ${inp('Comuna', 'o_comuna', o.comuna, { full: true })}
      ${formFooter(p ? 'Guardar cambios' : 'Crear ficha')}
    </form>`, async data => {
    if (!data.m_nombre) return toast('Ingresa el nombre de la mascota', 'error');
    if (!data.o_nombre) return toast('Ingresa el nombre del propietario', 'error');
    // Se toma la versión más reciente de la ficha (puede haber llegado de otro equipo)
    const target = id ? db.find(x => x.id === id) : blankPatient();
    if (!target) return toast('La ficha ya no existe', 'error');
    const mascota = {}, propietario = {};
    Object.entries(data).forEach(([k, v]) => {
      if (k.startsWith('m_')) mascota[k.slice(2)] = v;
      if (k.startsWith('o_')) propietario[k.slice(2)] = v;
    });
    target.mascota = { ...target.mascota, ...mascota };
    target.propietario = { ...target.propietario, ...propietario };
    touch(target);
    if (!id) db.push(target);
    if (!(await persist('upsert', target))) return;
    closeSheet();
    toast(id ? 'Datos actualizados' : 'Ficha creada');
    if (id) renderPatient(); else openPatient(target.id);
  });
  const r = document.querySelector('[name="o_rut"]'); if (r && r.value) rutHint(r);
}
function rutHint(el) {
  const h = document.getElementById('rutHint'); if (!h) return;
  const c = rutClean(el.value);
  if (!el.value || c.length < 8 || !/^[0-9kK.\-\s]+$/.test(el.value)) { h.textContent = ''; return; }
  h.innerHTML = rutValid(el.value) ? '<span class="text-emerald-600">✓ RUT válido</span>' : '<span class="text-amber-600">⚠ Dígito verificador no coincide (puedes guardar igual)</span>';
}

/* ---------- CRUD genérico ---------- */
async function upsertItem(key, data, itemId) {
  const p = cur(); if (!p) return;
  if (itemId) {
    const i = p[key].findIndex(x => x.id === itemId);
    if (i > -1) p[key][i] = { ...p[key][i], ...data };
    else p[key].push({ id: itemId, ...data });
  } else {
    p[key].push({ id: uid(), ...data });
  }
  touch(p);
  if (!(await persist('upsert', p))) return;
  closeSheet();
  renderPatient();
  toast('Registro guardado');
}
function delItem(key, itemId) {
  const nombres = { vacunas: 'esta vacuna', desparasitaciones: 'este antiparasitario', consultas: 'esta consulta' };
  confirmar(`¿Eliminar ${nombres[key]}? Esta acción no se puede deshacer.`, 'Eliminar', async () => {
    const p = cur(); if (!p) return;
    p[key] = p[key].filter(x => x.id !== itemId);
    touch(p);
    if (!(await persist('upsert', p))) return;
    renderPatient(); toast('Registro eliminado');
  });
}
function deletePatient(id) {
  const p = db.find(x => x.id === id); if (!p) return;
  confirmar(`¿Eliminar la ficha completa de <b>${esc(p.mascota.nombre)}</b>, incluyendo vacunas y consultas? <br><br><span class="text-rose-600 text-sm">Te recomendamos exportar un respaldo antes.</span>`, 'Eliminar ficha', async () => {
    db = db.filter(x => x.id !== id);
    if (!(await persist('remove', id))) return;
    state.fromList = false;
    location.hash = '#/';
    toast('Ficha eliminada');
  });
}

/* =================================================================
   RESPALDO: EXPORTAR / IMPORTAR JSON
   ================================================================= */
function exportar() {
  if (!db.length) return toast('No hay pacientes para exportar', 'error');
  const data = { app: 'CanyCat Ficha Clínica', version: APP_VERSION, exportado: new Date().toISOString(), origen: Store.nombre, total: db.length, pacientes: db };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const now = new Date();
  const name = `respaldo-canycat-${today()}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  setMeta({ lastBackup: new Date().toISOString() });
  toast(`Respaldo exportado (${plural(db.length, 'paciente', 'pacientes')})`);
  if (!state.pid) renderList();
}

let pendingImport = null;
function importar(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch (e) { return toast('El archivo no es un JSON válido', 'error'); }
    const arr = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.pacientes) ? parsed.pacientes : null;
    if (!arr) return toast('El archivo no contiene pacientes de CanyCat', 'error');
    const validos = arr.filter(p => p && typeof p === 'object' && p.mascota).map(normalizeP);
    if (!validos.length) return toast('No se encontraron fichas válidas', 'error');
    pendingImport = validos;
    const nuevos = validos.filter(v => !db.some(d => d.id === v.id)).length;
    openSheet('Importar respaldo', `
      <div class="rounded-2xl bg-brand-50 border border-brand-100 p-4 mb-4 text-sm">
        <p class="font-semibold text-brand-900 flex items-center gap-2"><i data-lucide="file-json" class="w-5 h-5"></i>${esc(file.name)}</p>
        <p class="text-brand-800 mt-1">${plural(validos.length, 'ficha', 'fichas')} en el archivo · ${plural(nuevos, 'nueva', 'nuevas')} · ${validos.length - nuevos} ya existente(s)</p>
        ${parsed.exportado ? `<p class="text-brand-700 text-xs mt-1">Exportado el ${fmtDate(String(parsed.exportado).slice(0, 10))}</p>` : ''}
        ${Store === CloudStore ? '<p class="text-brand-700 text-xs mt-1">Las fichas se guardarán en la nube.</p>' : ''}
      </div>
      <div class="space-y-3 pb-2">
        <button class="btn-primary w-full !justify-start text-left" onclick="aplicarImport('merge')">
          <i data-lucide="git-merge" class="w-6 h-6 shrink-0"></i>
          <span><span class="block">Combinar (recomendado)</span><span class="block text-xs font-normal text-brand-100">Agrega las nuevas y conserva la versión más reciente de cada ficha.</span></span>
        </button>
        <button class="btn w-full !justify-start text-left bg-white border border-rose-200 text-rose-700 active:bg-rose-50" onclick="aplicarImport('replace')">
          <i data-lucide="replace" class="w-6 h-6 shrink-0"></i>
          <span><span class="block">Reemplazar todo</span><span class="block text-xs font-normal text-rose-500">Borra las ${db.length} fichas actuales y usa solo las del archivo.</span></span>
        </button>
        <button class="btn-ghost w-full" onclick="closeSheet()">Cancelar</button>
      </div>`);
  };
  reader.onerror = () => toast('No se pudo leer el archivo', 'error');
  reader.readAsText(file);
}
function aplicarImport(modo) {
  if (!pendingImport) return;
  const run = async () => {
    let add = 0, upd = 0;
    if (modo === 'replace') {
      db = pendingImport; add = db.length;
    } else {
      pendingImport.forEach(p => {
        const i = db.findIndex(d => d.id === p.id);
        if (i === -1) { db.push(p); add++; }
        else if ((p.updatedAt || '') > (db[i].updatedAt || '')) { db[i] = p; upd++; }
      });
    }
    pendingImport = null;
    if (!(await persist('replaceAll', db))) return;
    closeSheet();
    toast(modo === 'replace' ? `Datos reemplazados: ${plural(add, 'ficha', 'fichas')}` : `Importado: ${plural(add, 'nueva', 'nuevas')}, ${plural(upd, 'actualizada', 'actualizadas')}`);
    route();
  };
  if (modo === 'replace') {
    closeSheet();
    confirmar('¿Seguro que deseas <b>reemplazar todas</b> las fichas por las del archivo?', 'Reemplazar', run);
  } else run();
}

/* =================================================================
   FIREBASE: acceso, sincronización y migración
   ================================================================= */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}
function showGate(mode, msg = '') {
  const aj = getAjustes();
  $('#gateProf').textContent = [aj.profesional, aj.titulo].filter(Boolean).join(' – ');
  let html = '';
  if (mode === 'loading') {
    html = `<div class="flex flex-col items-center gap-3 py-2 text-slate-500"><i data-lucide="loader-circle" class="w-8 h-8 spin text-brand-700"></i><p class="text-sm">${esc(msg || 'Cargando…')}</p></div>`;
  } else if (mode === 'login') {
    html = `${msg ? `<p class="mb-3 rounded-xl bg-rose-50 border border-rose-200 p-2.5 text-sm text-rose-700">${esc(msg)}</p>` : ''}
      <button class="btn-primary w-full" onclick="login()"><i data-lucide="log-in" class="w-5 h-5"></i>Ingresar con Google</button>
      <p class="mt-3 text-xs text-slate-400">Acceso exclusivo para el personal autorizado de la clínica.</p>`;
  } else {
    html = `<p class="mb-3 rounded-xl bg-amber-50 border border-amber-200 p-2.5 text-sm text-amber-800">${esc(msg)}</p>
      <button class="btn-primary w-full" onclick="location.reload()"><i data-lucide="refresh-cw" class="w-5 h-5"></i>Reintentar</button>`;
  }
  $('#gateBody').innerHTML = html;
  $('#gate').classList.remove('hidden');
  icons();
}
const hideGate = () => $('#gate').classList.add('hidden');

async function initCloud() {
  showGate('loading', 'Conectando…');
  try {
    for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(FIREBASE_SDK + f);
  } catch (e) {
    return showGate('error', 'No se pudo conectar con el servicio. Revisa tu conexión a internet e inténtalo de nuevo.');
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs = firebase.firestore();
    try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { console.warn('Sin caché offline:', e && e.code); }
    fb = { auth: firebase.auth(), fs };
    fb.auth.onAuthStateChanged(u => u ? onLogin(u) : (stopCloud(), showGate('login')));
  } catch (e) {
    console.error(e);
    showGate('error', 'La configuración de Firebase no es válida. Revisa el bloque FIREBASE_CONFIG.');
  }
}
async function login() {
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: 'select_account' });
  try { await fb.auth.signInWithPopup(prov); }
  catch (e) {
    const code = e && e.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') return fb.auth.signInWithRedirect(prov);
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
    const msgs = {
      'auth/unauthorized-domain': 'Este sitio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).',
      'auth/network-request-failed': 'Sin conexión a internet.'
    };
    showGate('login', msgs[code] || 'No se pudo iniciar sesión. Inténtalo de nuevo.');
  }
}
async function onLogin(u) {
  const email = String(u.email || '').toLowerCase();
  const permitidos = CORREOS_AUTORIZADOS.map(x => x.toLowerCase().trim()).filter(Boolean);
  if (permitidos.length && !permitidos.includes(email)) {
    await fb.auth.signOut();
    return showGate('login', `La cuenta ${email} no está autorizada para usar esta aplicación.`);
  }
  state.user = email;
  Store = CloudStore;
  showGate('loading', 'Cargando fichas…');
  let first = true;
  stopCloud();
  unsubSnap = col().onSnapshot({ includeMetadataChanges: true }, snap => {
    const changed = first || snap.docChanges().length > 0;
    if (changed) {
      db = snap.docs.map(d => normalizeP({ ...d.data(), id: d.id }));
      cloudIds = new Set(snap.docs.map(d => d.id));
    }
    updateSync(snap.metadata);
    if (first) { first = false; hideGate(); route(); return; }
    if (changed) refreshUI();
  }, async err => {
    console.error(err);
    if (err && err.code === 'permission-denied') {
      await fb.auth.signOut();
      showGate('login', `La cuenta ${email} no tiene permiso en la base de datos (revisa las reglas de Firestore).`);
    } else toast('Problema de conexión con la nube.', 'error');
  });
}
function stopCloud() { if (unsubSnap) { unsubSnap(); unsubSnap = null; } }
function logout() {
  confirmar('¿Cerrar sesión? Se borrará la copia sin conexión guardada en este equipo (los datos siguen seguros en la nube).', 'Cerrar sesión', async () => {
    stopCloud();
    try { await fb.auth.signOut(); await fb.fs.terminate(); await fb.fs.clearPersistence(); } catch (e) { console.warn(e); }
    location.hash = '#/';
    location.reload();
  });
}
/* Re-dibuja tras cambios remotos sin interrumpir a quien está escribiendo */
function refreshUI() {
  const ae = document.activeElement;
  if (!$('#sheet').classList.contains('hidden') || (ae && ae.closest && ae.closest('#anamForm'))) { state.pendingRefresh = true; return; }
  state.pendingRefresh = false;
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
/* Fichas guardadas en este dispositivo (v1.0) que aún no están en la nube */
function pendientesLocales() {
  if (Store !== CloudStore || getMeta().localSubido) return [];
  return LocalStore.loadAll().filter(l => {
    const c = db.find(x => x.id === l.id);
    return !c || (l.updatedAt || '') > (c.updatedAt || '');
  });
}
function subirLocales() {
  const list = pendientesLocales();
  list.forEach(p => {
    const i = db.findIndex(x => x.id === p.id);
    if (i > -1) db[i] = p; else db.push(p);
    CloudStore.upsert(p);
  });
  setMeta({ localSubido: new Date().toISOString() });
  toast(`${plural(list.length, 'ficha subida', 'fichas subidas')} a la nube`);
  renderList();
}

/* =================================================================
   NAVEGACIÓN (hash → el botón "atrás" del celular funciona)
   ================================================================= */
function openPatient(id) {
  state.tab = 'datos';
  state.fromList = true;
  location.hash = '#/p/' + encodeURIComponent(id);
}
function goBack() {
  if (state.fromList) { state.fromList = false; history.back(); }
  else location.hash = '#/';
}
function route() {
  const m = location.hash.match(/^#\/p\/(.+)$/);
  const pid = m ? decodeURIComponent(m[1]) : null;
  const inPatient = !!(pid && db.some(x => x.id === pid));
  if (m && !inPatient) history.replaceState(null, '', '#/');
  state.pid = inPatient ? pid : null;
  $('#view-list').classList.toggle('hidden', inPatient);
  $('#view-patient').classList.toggle('hidden', !inPatient);
  $('#fab').classList.toggle('hidden', inPatient);
  $('#btnBack').classList.toggle('hidden', !inPatient);
  if (inPatient) renderPatient(); else { state.fromList = false; renderList(); }
}
window.addEventListener('hashchange', () => { closeSheet(); route(); window.scrollTo(0, 0); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Inicio ---------- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (FIREBASE_CONFIG) {
  initCloud();
} else {
  Store = LocalStore;
  db = LocalStore.loadAll();
  // Sincroniza si hay otra pestaña abierta (solo modo local)
  window.addEventListener('storage', e => { if (e.key === KEY) { db = LocalStore.loadAll(); refreshUI(); } });
  updateSync();
  route();
}
icons();
</script>
